stages:
  - build
  - package
  - release

build_release:
  stage: build
  image: php:8.4-alpine
  before_script:
    - apk add --no-cache git zip unzip bash
  script:
    - VERSION=${CI_COMMIT_TAG}
    - echo "Building version ${VERSION}"
    - bash scripts/build_release.sh "${VERSION}"
    - sha256sum "helloasso-payment-processor-${VERSION}.zip" > SHA256SUMS
  artifacts:
    name: "helloasso-payment-processor-${CI_COMMIT_TAG}"
    paths:
      - helloasso-payment-processor-*.zip
      - SHA256SUMS
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG

publish_release_package:
  stage: package
  image: curlimages/curl:8.12.1
  needs:
    - job: build_release
      artifacts: true
  script:
    - 'export PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/helloasso-payment-processor/${CI_COMMIT_TAG}"'
    - 'curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "helloasso-payment-processor-${CI_COMMIT_TAG}.zip" "${PACKAGE_URL}/helloasso-payment-processor-${CI_COMMIT_TAG}.zip"'
    - 'curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file SHA256SUMS "${PACKAGE_URL}/SHA256SUMS"'
  rules:
    - if: $CI_COMMIT_TAG

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: publish_release_package
  script:
    - echo "Creating release on GitLab for ${CI_COMMIT_TAG}"
  release:
    name: 'Release ${CI_COMMIT_TAG}'
    description: 'Pour installer cette extension dans CiviCRM, utilisez le ZIP joint ci-dessous. Il contient les identifiants OAuth communautaires, absents des archives « Code source » générées par GitLab. Les traductions ne sont pas embarquées ; elles sont distribuées séparément via CiviCRM/Transifex.'
    tag_name: '${CI_COMMIT_TAG}'
    assets:
      links:
        - name: 'helloasso-payment-processor-${CI_COMMIT_TAG}.zip'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/helloasso-payment-processor/${CI_COMMIT_TAG}/helloasso-payment-processor-${CI_COMMIT_TAG}.zip'
          filepath: '/extension.zip'
          link_type: 'package'
        - name: 'SHA256 checksum'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/helloasso-payment-processor/${CI_COMMIT_TAG}/SHA256SUMS'
          filepath: '/SHA256SUMS'
          link_type: 'package'
  rules:
    - if: $CI_COMMIT_TAG
